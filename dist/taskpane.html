<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=edge"/><title>Annual Report Generator</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script src="https://cdn.jsdelivr.net/npm/docx@8/build/index.umd.min.js"></script><style>*{box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;margin:0;padding:16px;background:#f8f9fc;color:#1f2937}.header{background:linear-gradient(135deg,#1e3a8a,#3b5fb8);color:#fff;padding:18px 16px;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 8px rgba(30,58,138,.2)}.header h1{margin:0;font-size:18px;font-weight:700}.header p{margin:4px 0 0;font-size:12px;opacity:.9}.card{background:#fff;padding:16px;border-radius:10px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e5e8f0}.card-title{font-size:14px;font-weight:700;color:#1e3a8a;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #dbeafe}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:600;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}.field input,.field textarea{width:100%;padding:8px 10px;border:1px solid #d0d6e0;border-radius:6px;font-size:13px;font-family:inherit;color:#1f2937;background:#fafbfc;transition:all .15s}.field input:focus,.field textarea:focus{outline:0;border-color:#3b5fb8;background:#fff;box-shadow:0 0 0 3px rgba(59,95,184,.1)}.field textarea{resize:vertical;min-height:50px}.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#1e3a8a,#3b5fb8);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 2px 6px rgba(30,58,138,.25);display:flex;align-items:center;justify-content:center;gap:8px}.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(30,58,138,.35)}.btn-primary:disabled{opacity:.5;cursor:not-allowed}.gear{font-size:16px}</style><script defer="defer" src="polyfill.js"></script><script defer="defer" src="taskpane.js"></script></head><body><div class="header"><h1>📄 Annual Report Generator</h1><p>Excel → Word with full formatting</p></div><div class="card"><div class="card-title">Document Branding</div><div class="field"><label>Company Name</label> <input id="companyName" value="BLUE STAR LIMITED"/></div><div class="field"><label>CIN</label> <input id="companyCIN" value="(CIN : L28920MH1949PLC006870)"/></div><div class="field"><label>Right Header — Top</label> <input id="headerRightTop" value="Financial Statements"/></div><div class="field"><label>Right Header — Bottom</label> <input id="headerRightBot" value="Consolidated"/></div><div class="field"><label>Document Title</label> <textarea id="docTitle">Notes to Consolidated Financial Statements</textarea></div><div class="field"><label>Subtitle</label> <input id="docSubtitle" value="for the year ended March 31, 2025"/></div></div><button class="btn-primary" id="genBtn" onclick="generate()" disabled="disabled"><span class="gear">⚙️</span> <span>Generate Word Document</span></button><script src="851df73d2ff30cac0181.js"></script></body></html>
